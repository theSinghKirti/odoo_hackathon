{% extends "base.html" %}

{% block title %}Sign In - Subscription Manager{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="card">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Enter your credentials to access your tenant workspace</p>

    <div id="login-error">
      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="name@company.com" 
          required 
          autocomplete="email"
          value="{{ email or '' }}"
        >
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="/forgot-password" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">
        Sign In
      </button>
    </form>

    <p style="text-align: center; font-size: 0.875rem; margin-top: 1.5rem; color: var(--text-muted);">
      Don't have an account? 
      <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
