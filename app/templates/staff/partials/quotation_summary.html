<div class="card" id="quotation-summary-card" style="background: #FAFCFE; border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--space-5);">
  <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--navy); margin-bottom: 12px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px;">
    Order Summary
  </h3>

  <div style="display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem;">
    <!-- Subtotal -->
    <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
      <span>Subtotal</span>
      <span id="summary-subtotal" style="font-weight: 600; color: var(--navy);">₹0.00</span>
    </div>

    <!-- Discounts -->
    <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
      <span>Discount Deductions</span>
      <span id="summary-discount" style="font-weight: 600; color: #DC2626;">-₹0.00</span>
    </div>

    <!-- Taxes -->
    <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
      <span>Taxes (GST/VAT)</span>
      <span id="summary-tax" style="font-weight: 600; color: var(--navy);">+₹0.00</span>
    </div>

    <!-- Total -->
    <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--border); padding-top: 10px; margin-top: 4px;">
      <span style="font-size: 1.05rem; font-weight: 700; color: var(--navy);">Total Amount</span>
      <span id="summary-total" style="font-size: 1.5rem; font-weight: 700; color: var(--primary-teal);">₹0.00</span>
    </div>
  </div>

  <div style="margin-top: 14px; background: var(--pastel-sky); border: 1px solid #BFDBFE; border-radius: var(--radius-sm); padding: 8px 12px; font-size: 0.775rem; color: #1E40AF;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    Calculated in real-time according to configured Tax and Discount rules.
  </div>
</div>
